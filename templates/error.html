<!-- templates/error.html -->
{% extends "base.html" %}

{% block content %}
<div class="flex justify-center p-4 w-full">
    <div class="w-full max-w-lg bg-white rounded-lg shadow-sm border">
        <div class="bg-red-50 rounded-t-lg p-4 border-b border-red-100">
            <h2 class="text-2xl font-bold text-center flex items-center justify-center gap-2 text-red-700">
                <i data-lucide="alert-triangle" class="h-6 w-6"></i> Error
            </h2>
        </div>
        
        <div class="p-6">
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i data-lucide="alert-circle" class="h-5 w-5 text-red-500"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700">{{ error }}</p>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 text-center">
                <a href="{{ url_for('index') }}" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Go Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
